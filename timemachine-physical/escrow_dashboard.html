<!DOCTYPE html>
<html>
<head>
    <title>🔐 Urban Lab - Escrow Dashboard</title>
    <style>
        body { background: #0a0a0f; color: #00ffcc; font-family: monospace; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { text-align: center; border-bottom: 1px solid #00ffcc33; padding-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card { background: #0a0a1a; border: 1px solid #00ffcc33; border-radius: 10px; padding: 20px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: #00ffcc; }
        .stat-label { color: #66ffcc; opacity: 0.6; font-size: 12px; }
        .escrow-list { background: #0a0a1a; border: 1px solid #00ffcc33; border-radius: 10px; padding: 20px; }
        .escrow-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #00ffcc11; }
        .status { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        .status-released { background: #00cc44; color: #fff; }
        .status-pending { background: #ffcc00; color: #000; }
        .status-cancelled { background: #ff0044; color: #fff; }
        .refresh { margin: 20px 0; text-align: center; }
        .refresh button { background: #00ffcc; color: #0a0a0f; border: none; padding: 10px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .refresh button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 URBAN LAB - ESCROW DASHBOARD</h1>
            <p>Sistema Multisig 2/3 in Monero</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="total">0</div>
                <div class="stat-label">Totale Escrow</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="released">0</div>
                <div class="stat-label">✅ Rilasciati</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pending">0</div>
                <div class="stat-label">⏳ In Attesa</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="volume">0</div>
                <div class="stat-label">💰 Volume XMR</div>
            </div>
        </div>
        
        <div class="refresh">
            <button onclick="loadData()">🔄 Aggiorna</button>
        </div>
        
        <div class="escrow-list" id="escrowList">
            <h3>📋 Lista Escrow</h3>
            <div id="escrows">Caricamento...</div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5002/api/escrow';
        
        async function loadData() {
            try {
                const response = await fetch(API_URL + '/list');
                const data = await response.json();
                
                const escrows = data.escrows || [];
                const total = escrows.length;
                const released = escrows.filter(e => e.status === 'RELEASED').length;
                const pending = escrows.filter(e => e.status === 'PENDING').length;
                const volume = escrows.reduce((sum, e) => sum + e.amount, 0);
                
                document.getElementById('total').textContent = total;
                document.getElementById('released').textContent = released;
                document.getElementById('pending').textContent = pending;
                document.getElementById('volume').textContent = volume.toFixed(2);
                
                const listHtml = escrows.map(e => `
                    <div class="escrow-item">
                        <span>${e.escrowId}</span>
                        <span>${e.amount} XMR</span>
                        <span class="status status-${e.status.toLowerCase()}">${e.status}</span>
                        <span>${new Date(e.createdAt).toLocaleString()}</span>
                    </div>
                `).join('');
                
                document.getElementById('escrows').innerHTML = listHtml || 'Nessun escrow trovato';
            } catch (error) {
                document.getElementById('escrows').textContent = '❌ Errore: ' + error.message;
            }
        }
        
        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
